
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 450px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 23px;
            margin-bottom: 25px;
        }

        .student-image {
            display: block;
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            margin: 0 auto 25px;
            border: 4px solid #667eea;
        }

        .details {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
        }

        .details p {
            padding: 12px 5px;
            border-bottom: 1px solid #e0e0e0;
            color: #444;
            font-size: 16px;
        }

        .details p:last-child {
            border-bottom: none;
        }

        strong {
            color: #333;
        }

        .status {
            background: #dcfce7;
            color: #15803d;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .inactive {
            background: #fee2e2;
            color: #dc2626;
        }

        .back-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            margin-top: 25px;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 7px;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-btn:hover {
            transform: translateY(-2px);
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Student Details - ID: {{ student[0] }}</h1>

        <img src="{{ student[6] }}"
             alt="Student Image"
             class="student-image">

        <div class="details">

            <p><strong>Name:</strong> {{ student[1] }}</p>

            <p><strong>Age:</strong> {{ student[2] }}</p>

            <p><strong>Gender:</strong> {{ student[3] }}</p>

            <p><strong>Marks:</strong> {{ student[4] }}</p>

            <p><strong>Course:</strong> {{ student[5] }}</p>

            <p>
                <strong>Status:</strong>

                {% if student[7] == 1 %}
                    <span class="status">Active</span>
                {% else %}
                    <span class="status inactive">Inactive</span>
                {% endif %}
            </p>

        </div>

        <a href="/" class="back-btn">Back to Home</a>

    </div>

</body>
</html>
