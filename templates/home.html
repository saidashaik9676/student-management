
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #eef2ff;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #312e81;
            font-size: 36px;
            margin-bottom: 30px;
        }

        .add-btn {
            display: block;
            width: fit-content;
            margin: 0 auto 35px;
            padding: 12px 24px;
            background: #7c3aed;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            transition: 0.3s;
        }

        .add-btn:hover {
            background: #5b21b6;
        }

        .container {
            max-width: 1150px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .student-card {
            background: #ffffff;
            padding: 22px;
            border: 1px solid #ddd6fe;
            border-radius: 10px;
            transition: 0.3s;
        }

        .student-card:hover {
            border-color: #8b5cf6;
            transform: scale(1.02);
        }

        .student-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .student-card p {
            color: #4b5563;
            font-size: 15px;
            margin: 13px 0;
        }

        .student-card p strong {
            color: #312e81;
        }

        .status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 5px;
            background: #ede9fe;
            color: #6d28d9;
            font-size: 13px;
            font-weight: 600;
        }

        .student-card a {
            display: inline-block;
            text-decoration: none;
            padding: 8px 16px;
            margin-top: 10px;
            margin-right: 8px;
            border-radius: 5px;
            font-size: 14px;
            background: #7c3aed;
            color: white;
        }

        .student-card a:hover {
            background: #5b21b6;
        }

        .student-card a:last-child {
            background: #dc2626;
        }

        .student-card a:last-child:hover {
            background: #991b1b;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <h1>Student Management</h1>

    <a href="/students/add" class="add-btn">
        + Add Student
    </a>

    <div class="container">

        {% for std in students %}

        <div class="student-card">

            <img src="{{ std[6] }}" alt="Student Image">

            <p><strong>Name:</strong> {{ std[1] }}</p>

            <p><strong>Age:</strong> {{ std[2] }}</p>

            <p><strong>Gender:</strong> {{ std[3] }}</p>

            <p><strong>Marks:</strong> {{ std[4] }}</p>

            <p><strong>Course:</strong> {{ std[5] }}</p>

            <p>
                <strong>Status:</strong>
                <span class="status">
                    {{ "Active" if std[7] == 1 else "Inactive" }}
                </span>
            </p>

            <a href="/student/{{ std[0] }}">View</a>

            <a href="/std/delete/{{ std[0] }}">Delete</a>

            <a href="/students/update/{{std[0]}}">UPDATE</a>

        </div>

        {% endfor %}

    </div>

</body>
</html>
