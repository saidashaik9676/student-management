
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Student</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
        }

        .container {
            width: 400px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Update Student</h2>

    <form action="/students/update/{{ student[0] }}" method="POST">

        <label>Name:</label>
        <input type="text" name="name"
               value="{{ student[1] }}" required>

        <label>Age:</label>
        <input type="number" name="age"
               value="{{ student[2] }}" required>

        <label>Gender:</label>
        <select name="gender">
            <option value="Male"
                {% if student[3] == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female"
                {% if student[3] == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other"
                {% if student[3] == 'Other' %}selected{% endif %}>Other</option>
        </select>

        <label>Marks:</label>
        <input type="number" name="marks"
               value="{{ student[4] }}" required>

        <label>Course:</label>
        <input type="text" name="course"
               value="{{ student[5] }}" required>

        <label>Image:</label>
        <input type="text" name="image"
               value="{{ student[6] }}" required>

        <label>Status:</label>
        <select name="status">
            <option value="1"
                {% if student[7] == 1 %}selected{% endif %}>Active</option>
            <option value="0"
                {% if student[7] == 0 %}selected{% endif %}>Inactive</option>
        </select>

        <button type="submit">Update Student</button>

    </form>

</div>

</body>
</html>
